name: shadow_hunters
description: "Shadow Hunters — a 2D fantasy physics archery game for Android. Offline, 15 levels."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # 2D game engine
  flame: ^1.17.0

  # Local device storage (progress / unlocked levels)
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
