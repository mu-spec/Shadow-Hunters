include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # These are purely stylistic ("use const") and generate many info-level
    # hints that would otherwise fail a strict `flutter analyze` build gate.
    # Disabling them keeps the analyze step green without any behavioural change.
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_const_constructors_in_immutables: false
    prefer_const_literals_to_create_immutables: false

    prefer_final_locals: true
    avoid_print: true

analyzer:
  exclude:
    - build/**
