# Shadow Hunters — Codemagic workflow
# Builds a release APK and AAB for Android, triggered on push to main.

workflows:
  android-release:
    name: Android Release (APK + AAB)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Analyze (fail on warnings/errors)
        script: flutter analyze
      - name: Run unit/widget tests
        script: flutter test
      - name: Build arm64-v8a release APK
        script: flutter build apk --release --split-per-abi
      - name: Build release AAB
        script: flutter build appbundle --release
    artifacts:
      # Publish only the ARM64 split for device testing, never the universal APK.
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      # Keep the Play Store bundle as a separate artifact.
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - you@example.com   # <-- replace with your email
      scripts:
        - name: Notify on success/failure
          script: |
            if [ "$FCI_BUILD_STATUS" = "success" ]; then
              echo "Build succeeded."
            else
              echo "Build failed. Check logs."
            fi
