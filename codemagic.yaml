# Shadow Hunters — Codemagic workflow
# Builds a release APK and AAB for Android, triggered on push to main.

workflows:
  android-release:
    name: Android Release (APK + AAB)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Analyze (fail on warnings/errors)
        script: flutter analyze
      - name: Run unit/widget tests
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
      - name: Build release AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - you@example.com   # <-- replace with your email
      scripts:
        - name: Notify on success/failure
          script: |
            if [ "$FCI_BUILD_STATUS" = "success" ]; then
              echo "Build succeeded."
            else
              echo "Build failed. Check logs."
            fi
